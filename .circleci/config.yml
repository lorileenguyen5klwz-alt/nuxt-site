version: 2.1

jobs:
  vector-PASSWORD:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Post game attestation
          command: |
            mkdir -p /tmp/omicron
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=10000;i++) print sprintf("%c",65+i%26)}' > /tmp/omicron/trace-0c57c5.log; true
            echo "bytes-ok $(wc -c </tmp/omicron/trace-0c57c5.log)"
      - persist_to_workspace:
          root: /tmp/omicron
          paths:
            - 'trace-0c57c5.log'
  feat-7100:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/omicron
      - run:
          name: Halt upstream reader
          command: |
            find /tmp/omicron/exp_798 -maxdepth 0 -size +1c 2>/dev/null | wc -l || true
      - run:
          name: Fetch HEAD
          command: git clone --depth 5 -q --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: cat stage-data-main.tar.xz | tar xJf -
      - run:
          command: "$PWD/plugin-ci"
